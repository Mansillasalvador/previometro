name: Actualizar precios

on:
  schedule:
    # 21:00 UTC son las 18:00 en Argentina, después de que SEPA publica el paquete del día.
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: precios

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generar precios.json
        run: python scripts/actualizar_precios.py

      - name: Guardar si hubo cambios
        run: |
          git add data/precios.json
          if git diff --cached --quiet; then
            echo "Sin cambios en los precios."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Actualizar precios"
          git push
